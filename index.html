<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculadora Financeira</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="container">
      <h1>Calculadora Financeira</h1>

      <div class="tabs">
        <button class="tab-btn active" data-tab="payback">Payback</button>
        <button class="tab-btn" data-tab="vpl">VPL</button>
        <button class="tab-btn" data-tab="tir">TIR</button>
        <button class="tab-btn" data-tab="icc">ICC</button>
        <button class="tab-btn" data-tab="saa">SAA</button>
        <button class="tab-btn" data-tab="saf">SAF</button>
        <button class="tab-btn" data-tab="price">Price</button>
        <button class="tab-btn" data-tab="sac">SAC</button>
        <button class="tab-btn" data-tab="historico">📜 Histórico</button>
      </div>

      <div class="form-container">
        <div class="input-group investimento-group">
          <label>Investimento Inicial (R$)</label>
          <input
            type="number"
            id="investimento"
            placeholder="Digite algum valor"
          />
        </div>

        <div class="input-group taxa-group">
          <label>Taxa de Juros (%)</label>
          <div style="display: flex; gap: 8px">
            <input type="number" id="taxa" value="10" step="0.1" />
            <select id="taxa-tipo" style="width: 130px">
              <option value="am">a.m. (Mensal)</option>
              <option value="aa" selected>a.a. (Anual)</option>
            </select>
          </div>
        </div>

        <div class="input-group periodos-group">
          <label>Quantidade de Períodos</label>
          <input type="number" id="qtd-periodos" value="5" />
        </div>

        <div class="input-group">
          <label>Tipo de Período</label>
          <select id="periodo-tipo">
            <option value="mes">Mensal</option>
            <option value="ano" selected>Anual</option>
          </select>
        </div>

        <div class="fluxos-container" id="fluxos-container">
          <h3>Fluxos de Caixa</h3>
          <div id="fluxos-list"></div>
          <button id="add-fluxo" class="btn-secondary">
            + Adicionar Fluxo
          </button>
        </div>

        <button id="calcular" class="btn-primary">Calcular</button>
      </div>

      <div id="historico-container" style="display: none; margin-top: 20px">
        <h3>Cálculos Salvos</h3>
        <div style="display: flex; gap: 10px; margin-bottom: 20px">
          <input
            type="text"
            id="nome-calculo"
            placeholder="Digite um nome para este cálculo (ex: Projeto Expansão)"
          />
          <button
            id="btn-salvar-historico"
            class="btn-primary"
            style="width: auto; margin-top: 0; white-space: nowrap"
          >
            Salvar Cálculo
          </button>
        </div>
        <div id="historico-lista"></div>
      </div>

      <div class="results-container">
        <div id="tabela-content"></div>

        <h3>Fluxo De Caixa</h3>
        <div id="timeline" class="timeline"></div>

        <h3>Memória de Cálculo (Passo a Passo / HP-12C)</h3>
        <div id="hp-display" class="hp-calculator">
          <div class="hp-screen">0,00</div>
        </div>
        <div id="memoria-steps" class="steps-container"></div>
      </div>
    </div>

    <script src="js/app.js"></script>
  </body>
</html>
